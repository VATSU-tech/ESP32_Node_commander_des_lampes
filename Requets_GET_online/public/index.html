<!DOCTYPE html>
<html>
<head>
  <title>Contrôle Lampes</title>
</head>
<body>

<h2>Lampe</h2>

<button onclick="setLed('ON')">ON</button>
<button onclick="setLed('OFF')">OFF</button>

<script>
function setLed(state) {
  fetch("http://localhost:3000/led/led1", {
//   fetch("https://ton-serveur.onrender.com/led/led1", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ state })
  });
}
</script>

</body>
</html>
